        const sanitizeCloudData = (cloudData) => {
            const template = getInitialDataTemplate();
            if (!cloudData) return template;
            
            const toArr = (val, fallback) => {
                if (!val) return fallback;
                if (Array.isArray(val)) return val;
                return Object.values(val);
            };

            const sanitized = {
                ...template,
                ...cloudData,
                activities: toArr(cloudData.activities, template.activities),
                customActivities: toArr(cloudData.customActivities, template.customActivities),
                tradSports: toArr(cloudData.tradSports, template.tradSports),
                customTradSports: toArr(cloudData.customTradSports, template.customTradSports),

                customTeams: toArr(cloudData.customTeams, template.customTeams),
                medalSettings: toArr(cloudData.medalSettings, template.medalSettings),
                teamSubmissions: cloudData.teamSubmissions || {},
                drawData: cloudData.drawData || {},
                matchSchedules: cloudData.matchSchedules || {},
                standingsOverrides: cloudData.standingsOverrides || {},
                deadlines: cloudData.deadlines || template.deadlines,
                sportMedalWinners: cloudData.sportMedalWinners || {}
            };

            if (!sanitized.venues) sanitized.venues = {};
            for (let key in template.venues) {
                if (!sanitized.venues[key]) { sanitized.venues[key] = template.venues[key]; } 
                else {
                    sanitized.venues[key].options = template.venues[key].options;
                    sanitized.venues[key].name = template.venues[key].name;
                    if (sanitized.venues[key].selected && !template.venues[key].options.includes(sanitized.venues[key].selected)) sanitized.venues[key].selected = '';
                }
            }
            return sanitized;
        };

            const Page13 = ({ data, selectedMatchSport, setSelectedMatchSport }) => {
                const activeTeams = [...data.villages.filter(v => v.isParticipating !== false), ...(data.customTeams || [])];
                const submissions = data.teamSubmissions || {};
                const activeIntlSports = data.activities.find(a => a.id === 'intl')?.selected ? data.intlSports : [];
                const activeTradSports = data.activities.find(a => a.id === 'trad')?.selected ? [...data.tradSports.filter(s => s.selected), ...(data.customTradSports || [])] : [];
                const allSports = [...activeIntlSports.map(s => ({ ...s, type: 'intl', key: `intl_${s.id}` })), ...activeTradSports.map((s, i) => ({ ...s, type: 'trad', key: `trad_${s.id || 'c'+i}` }))];

                const validSports = allSports.filter(sport => { const count = activeTeams.filter(t => submissions[sport.key]?.[t.id]).length; return count >= 1; });
                let currentSportKey = selectedMatchSport;
                if (!currentSportKey || !validSports.find(s => s.key === currentSportKey)) { currentSportKey = validSports.length > 0 ? validSports[0].key : null; }

                const matchSchedules = data.matchSchedules || {};
                const currentMatches = Array.isArray(matchSchedules[currentSportKey]) ? matchSchedules[currentSportKey] : Object.values(matchSchedules[currentSportKey] || {});
                const standingsOverrides = data.standingsOverrides || {};
                const currentOverrides = standingsOverrides[currentSportKey] || {};

                const calculatedStandings = {};
                currentMatches.forEach(m => {
                    const g = m.group ? m.group.trim() : '';
                    if (!g || !m.home || !m.away) return;
                    if (!calculatedStandings[g]) calculatedStandings[g] = {};
                    [m.home, m.away].forEach(team => { if (!calculatedStandings[g][team]) calculatedStandings[g][team] = { team: team, p:0, w:0, d:0, l:0, gf:0, ga:0, pts:0 }; });
                    if (m.homeScore !== '' && m.awayScore !== '') {
                        const hs = parseInt(m.homeScore) || 0, as = parseInt(m.awayScore) || 0;
                        calculatedStandings[g][m.home].p += 1; calculatedStandings[g][m.away].p += 1;
                        calculatedStandings[g][m.home].gf += hs; calculatedStandings[g][m.home].ga += as;
                        calculatedStandings[g][m.away].gf += as; calculatedStandings[g][m.away].ga += hs;
                        if (hs > as) { calculatedStandings[g][m.home].w += 1; calculatedStandings[g][m.home].pts += 3; calculatedStandings[g][m.away].l += 1; } 
                        else if (hs < as) { calculatedStandings[g][m.away].w += 1; calculatedStandings[g][m.away].pts += 3; calculatedStandings[g][m.home].l += 1; } 
                        else { calculatedStandings[g][m.home].d += 1; calculatedStandings[g][m.home].pts += 1; calculatedStandings[g][m.away].d += 1; calculatedStandings[g][m.away].pts += 1; }

                                                        <td className="p-2 text-right font-bold">{m.home || '-'}</td>

                                                        <td className="p-2 text-left font-bold">{m.away || '-'}</td>
                                                        <td className="p-2 text-sm text-slate-600">{m.note || '-'}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                <div className="w-full xl:w-[420px] shrink-0 flex flex-col overflow-hidden bg-white/60 rounded-2xl border border-white/50 shadow-inner">
                                    <div className="px-4 py-3 bg-gradient-to-r from-orange-500 to-yellow-500 text-white font-black flex items-center justify-between border-b-2 border-white/30"><div className="flex items-center"><Icons.Calculator className="w-5 h-5 mr-2"/> ตารางคะแนน</div></div>
                                    <div className="flex-1 overflow-auto p-3 space-y-4">
                                        {Object.keys(calculatedStandings).length === 0 ? (
                                            <div className="text-center text-sm text-slate-400 font-bold mt-10">ยังไม่มีข้อมูลคะแนน</div>
                                        ) : (
                                            Object.keys(calculatedStandings).sort().map(groupName => {
                                                const groupStats = calculatedStandings[groupName];
                                                const sortedTeams = Object.values(groupStats).sort((a, b) => {
                                                    const aPts = currentOverrides[groupName]?.[a.team]?.pts ?? a.pts; const bPts = currentOverrides[groupName]?.[b.team]?.pts ?? b.pts;
                                                    if (bPts !== aPts) return bPts - aPts;
                                                    const aGD = (currentOverrides[groupName]?.[a.team]?.gf ?? a.gf) - (currentOverrides[groupName]?.[a.team]?.ga ?? a.ga);
                                                    const bGD = (currentOverrides[groupName]?.[b.team]?.gf ?? b.gf) - (currentOverrides[groupName]?.[b.team]?.ga ?? b.ga);
                                                    return bGD - aGD;

                                                    <div key={groupName} className="bg-white/95 rounded-xl shadow-md border border-slate-200 overflow-hidden">
                                                        <div className="bg-slate-800 text-white text-xs font-black py-2 px-3">กลุ่ม / สาย: <span className="text-yellow-400 text-sm ml-1">{groupName}</span></div>

                                                            <thead className="bg-slate-100 text-slate-600 font-bold border-b border-slate-200"><tr><th className="p-1.5 text-left pl-3">ทีม</th><th className="p-1.5 w-8">ข</th><th className="p-1.5 w-8">ช</th><th className="p-1.5 w-8">ส</th><th className="p-1.5 w-8">พ</th><th className="p-1.5 w-8">ด</th><th className="p-1.5 w-8">ส</th><th className="p-1.5 w-12 text-indigo-700">แต้ม</th></tr></thead>
                                                            <tbody>
                                                                {sortedTeams.map(t => {
                                                                    const ov = currentOverrides[groupName]?.[t.team] || {};
                                                                    return (
                                                                        <tr key={t.team} className="border-b border-slate-100 last:border-0">

                                                                            <td className={`p-1 border-l border-slate-100 ${ov.p!==undefined?'text-orange-600 font-black':''}`}>{ov.p !== undefined ? ov.p : t.p}</td>

                                                                            <td className={`p-1 bg-yellow-50/50 ${ov.d!==undefined?'text-orange-600 font-black':''}`}>{ov.d !== undefined ? ov.d : t.d}</td>
                                                                            <td className={`p-1 bg-red-50/50 ${ov.l!==undefined?'text-orange-600 font-black':''}`}>{ov.l !== undefined ? ov.l : t.l}</td>
                                                                            <td className={`p-1 border-l border-slate-100 ${ov.gf!==undefined?'text-orange-600 font-black':''}`}>{ov.gf !== undefined ? ov.gf : t.gf}</td>

                                                                            <td className={`p-1 bg-indigo-50 border-l border-indigo-100 font-black text-indigo-700 text-base ${ov.pts!==undefined?'text-orange-600':''}`}>{ov.pts !== undefined ? ov.pts : t.pts}</td>
                                                                        </tr>

                                    </div>
                                </div>
                            </div>

            const Page14 = ({ data, selectedMedalSport, setSelectedMedalSport }) => {
                const activeTeams = [...data.villages.filter(v => v.isParticipating !== false), ...(data.customTeams || [])];
                const medalSettings = data.medalSettings || [];
                const sportMedalWinners = data.sportMedalWinners || {};
                const activeIntlSports = data.activities.find(a => a.id === 'intl')?.selected ? data.intlSports : [];
                const activeTradSports = data.activities.find(a => a.id === 'trad')?.selected ? [...data.tradSports.filter(s => s.selected), ...(data.customTradSports || [])] : [];
                const allSports = [...activeIntlSports.map(s => ({ ...s, type: 'intl', key: `intl_${s.id}` })), ...activeTradSports.map((s, i) => ({ ...s, type: 'trad', key: `trad_${s.id || 'c'+i}` }))];

                const submissions = data.teamSubmissions || {};
                const validSports = allSports.filter(sport => { const count = activeTeams.filter(t => submissions[sport.key]?.[t.id]).length; return count >= 1; });
                let currentSportKey = selectedMedalSport;
                if (!currentSportKey || !validSports.find(s => s.key === currentSportKey)) { currentSportKey = validSports.length > 0 ? validSports[0].key : null; }
                const currentSportWinners = sportMedalWinners[currentSportKey] || {};

                let teamsToShow = activeTeams.filter(t => submissions[currentSportKey]?.[t.id]);
                if (teamsToShow.length === 0) { teamsToShow = activeTeams; }

                const derivedTallies = {}; 
                Object.entries(sportMedalWinners || {}).forEach(([sKey, medalsObj]) => {
                    if(!medalsObj || typeof medalsObj !== 'object') return;
                    Object.entries(medalsObj).forEach(([mId, teamIdsObj]) => { 
                        if(!teamIdsObj) return;
                        const teamIds = Array.isArray(teamIdsObj) ? teamIdsObj : Object.values(teamIdsObj);
                        teamIds.forEach(tId => { if (tId) { if (!derivedTallies[tId]) derivedTallies[tId] = {}; derivedTallies[tId][mId] = (derivedTallies[tId][mId] || 0) + 1; } }); 
                    });
                });

                const teamsWithScores = activeTeams.map(team => {
                    const teamTally = derivedTallies[team.id] || {}; let totalPoints = 0;
                    medalSettings.forEach(medal => { const count = teamTally[medal.id] || 0; totalPoints += count * medal.points; });
                    return { ...team, totalPoints, tally: teamTally };
                });
                teamsWithScores.sort((a, b) => b.totalPoints - a.totalPoints);

                return (
                    <div className="flex flex-col h-[calc(100vh-140px)] w-full max-w-7xl mx-auto cursor-default">
                        <div className="flex items-center justify-between border-b-2 border-amber-500 pb-2 mb-4 shrink-0 bg-white/70 backdrop-blur-md p-4 rounded-xl shadow-sm">
                            <div className="flex items-center space-x-3"><Icons.Award className="w-8 h-8 text-amber-600"/><h2 className="text-2xl font-black text-amber-950">สรุปเหรียญรางวัล</h2></div>
                            <button onClick={() => window.print()} className="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-lg font-bold shadow-md transition-colors flex items-center no-print"><Icons.Printer className="w-5 h-5 mr-2"/> พิมพ์เอกสาร</button>

                                            </div>

                                </div>

                                    {validSports.length > 0 ? (

                                                {validSports.map(s => (<option key={s.key} value={s.key}>{s.type === 'trad' ? s.name : `${s.name} ${s.ageText||''} ${s.age!==null?s.age:''} ${s.unit||''}`.trim()}</option>))}
                                            </select>
                                            <div className="flex-1 space-y-3 overflow-y-auto">

                                                    const winnersRaw = currentSportWinners[medal.id] || [];
                                                    const winners = Array.isArray(winnersRaw) ? winnersRaw : Object.values(winnersRaw);
                                                    return (
                                                        <div key={medal.id} className="bg-slate-50 p-3 rounded-xl border border-slate-200 shadow-sm">
                                                            <div className="font-bold text-slate-700 text-sm mb-2">{medal.name} <span className="text-amber-600 font-black">({medal.points} แต้ม)</span></div>

                            <div className="bg-white/95 backdrop-blur-xl rounded-2xl shadow-xl flex-1 flex flex-col overflow-hidden border">
                                <div className="bg-gradient-to-r from-amber-500 to-yellow-400 px-4 py-3 text-white font-black text-lg">3. ตารางคะแนนรวมกีฬา (คำนวณอัตโนมัติ)</div>
                                <div className="flex-1 overflow-auto"><table className="w-full text-center border-collapse min-w-[700px]"><thead className="bg-slate-50 sticky top-0 shadow-sm border-b"><tr><th className="p-3 w-16">อันดับ</th><th className="p-3 text-left">หมู่บ้าน / ทีม</th>{medalSettings.map(m=><th key={m.id} className="p-3"><div>{m.name}</div><div className="text-[10px] text-amber-600">({m.points} แต้ม)</div></th>)}<th className="p-3 text-amber-700 bg-amber-50">คะแนนรวม</th></tr></thead><tbody>
                                    {teamsWithScores.map((team)=>{ let rank = teamsWithScores.findIndex(x=>x.totalPoints===team.totalPoints)+1; let dR = team.totalPoints>0 ? rank : "-"; return (
                                        <tr key={team.id} className="border-b hover:bg-slate-50"><td className="p-2 font-bold text-slate-500">{dR===1&&team.totalPoints>0?<Icons.Trophy className="w-6 h-6 mx-auto text-yellow-500"/>:dR}</td><td className="p-2 text-left flex items-center"><div className="w-4 h-4 rounded-full mr-2 border" style={{background:team.color}}></div><span className="font-bold text-base">{team.name}</span></td>{medalSettings.map(m=><td key={m.id} className="p-2 font-black text-lg">{team.tally[m.id]||0}</td>)}<td className="p-2 bg-amber-50 font-black text-2xl text-amber-600">{team.totalPoints}</td></tr>
                                    )})}
                                    {teamsWithScores.length===0&&<tr><td colSpan={medalSettings.length+3} className="py-10 text-slate-400">ยังไม่มีทีมส่งแข่ง</td></tr>}
                                </tbody></table></div>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderPage = ({ currentPage, data, calMonth, setCalMonth, calYear, setCalYear, selectedDrawSport, setSelectedDrawSport, selectedMatchSport, setSelectedMatchSport, selectedMedalSport, setSelectedMedalSport, currentYear }) => {
                switch(currentPage) {
                    case 'page1': return <Page1 data={data} currentYear={currentYear} />; 
                    case 'page2': return <Page2 data={data} calMonth={calMonth} setCalMonth={setCalMonth} calYear={calYear} setCalYear={setCalYear} />; 
                    case 'page3': return <Page3 data={data} />; 
                    case 'page4': return <Page4 data={data} />;
                    case 'page5': return <Page5 data={data} />; 
                    case 'page6': return <Page6 data={data} />; 
                    case 'page7': return <Page7 data={data} />; 
                    case 'page8': return <Page8 data={data} />;
                    case 'page9': return <Page9 data={data} />; 
                    case 'page10': return <Page10 data={data} calMonth={calMonth} setCalMonth={setCalMonth} calYear={calYear} setCalYear={setCalYear} />; 
                    case 'page11': return <Page11 data={data} />; 
                    case 'page12': return <Page12 data={data} selectedDrawSport={selectedDrawSport} setSelectedDrawSport={setSelectedDrawSport} />;
                    case 'page13': return <Page13 data={data} selectedMatchSport={selectedMatchSport} setSelectedMatchSport={setSelectedMatchSport} />; 
                    case 'page14': return <Page14 data={data} selectedMedalSport={selectedMedalSport} setSelectedMedalSport={setSelectedMedalSport} />; 
                    default: return <Dashboard currentYear={currentYear} setCurrentYear={setCurrentYear} isLoaded={isLoaded} handleLogoClick={handleLogoClick} setCurrentPage={setCurrentPage} />;
                }
            };

            return (
                <div className="h-screen w-screen flex text-slate-800 overflow-hidden bg-transparent">
                    {/* Sidebar */}
                    <div className={`w-72 bg-blue-950 text-slate-300 flex flex-col shadow-2xl transition-all duration-300 z-50 shrink-0 no-print ${currentPage === 'dashboard' ? '-ml-72 opacity-0' : 'ml-0 opacity-100'}`}>
                        <div className="p-6 bg-blue-900 border-b border-blue-800 flex flex-col items-center justify-center text-center relative">
                            <img src="https://res.cloudinary.com/dygneumft/image/upload/v1673863188/%E0%B8%AA%E0%B8%B1%E0%B8%8D%E0%B8%A5%E0%B8%B1%E0%B8%81%E0%B8%A9%E0%B8%93%E0%B9%8C%E0%B8%81%E0%B8%B5%E0%B8%AC%E0%B8%B2%20%E0%B8%AD%E0%B8%9B%E0%B8%97.%2066/%E0%B8%95%E0%B8%B1%E0%B8%A7%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87_3_edtiil.png" alt="โลโก้กีฬา" className="w-24 h-24 object-contain mb-3 mx-auto drop-shadow-md cursor-pointer hover:scale-105 transition-transform duration-300" onClick={handleLogoClick}/>
                            <h2 className="text-xl font-black text-white cursor-pointer hover:text-orange-400 transition-colors" onClick={() => setCurrentPage('dashboard')}>กีฬาตำบลแม่พูล</h2>
                            <div className="flex items-center space-x-2 text-orange-300 bg-orange-900/40 px-4 py-1.5 rounded-full border border-orange-500/30 shadow-inner mt-3 w-max mx-auto mb-4">
                                <div className="w-2 h-2 rounded-full bg-orange-400 animate-pulse"></div><span className="text-xs font-bold tracking-wider">ข้อมูลปี {currentYear}</span>
                            </div>
                            <div className="flex flex-col w-full space-y-2 mt-2 px-2">
                                <div className="flex items-center justify-center px-2 py-2 rounded-lg text-xs font-bold bg-slate-800 text-slate-300 shadow-inner border border-slate-700"><Icons.Lock className="w-4 h-4 mr-1.5"/> โหมดอ่านอย่างเดียว</div>
                                <div className={`flex items-center justify-center px-2 py-2 rounded-lg text-xs font-bold shadow-sm border ${isLoaded ? 'bg-green-500/20 text-green-300 border-green-500/50' : 'bg-orange-500/20 text-orange-300 border-orange-500/50 animate-pulse'}`}>{isLoaded ? 'ออนไลน์ (อัปเดตล่าสุด)' : 'กำลังเชื่อมต่อ...'}</div>
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto py-2">
                            {menuItems.filter(i=>i.id!=='dashboard').map(i => (
                                <button key={i.id} onClick={()=>setCurrentPage(i.id)} className={`w-full text-left px-5 py-3 flex items-center space-x-3 text-sm ${currentPage===i.id?'bg-orange-500 text-white font-bold':'hover:bg-blue-900'}`}><i.icon className="w-5 h-5"/> <span>{i.label.split('.')[1]?.trim()||i.label}</span></button>
                            ))}
                        </div>
                        <div className="p-5 border-t border-blue-900 bg-blue-950">
                             <button onClick={() => setCurrentPage('dashboard')} className="w-full py-3.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-white font-bold transition-all shadow-md flex items-center justify-center space-x-2 btn-hover-effect border border-slate-700"><Icons.Home className="w-6 h-6"/> <span>กลับหน้าสรุป</span></button>
                        </div>
                    </div>

                    <div className="flex-1 h-full relative flex flex-col bg-slate-50/20 min-w-0">
                        {currentPage !== 'dashboard' && (
                        <div className="bg-white/95 backdrop-blur-md px-8 py-4 shadow-sm flex justify-between items-center z-40 border-b border-slate-200 no-print">
                            <div className="text-lg font-black text-blue-900 flex items-center space-x-3"><span className="bg-blue-100 text-blue-800 px-5 py-2 rounded-full border shadow-sm text-base">การประชุมครั้งที่ {data.meetingNo || '-'}/{currentYear}</span></div>
                            <div className="flex space-x-4">
                                {currentPage !== 'page1' && <button onClick={() => { const idx = menuItems.findIndex(m => m.id === currentPage); if(idx > 1) setCurrentPage(menuItems[idx-1].id); }} className="px-6 py-2.5 text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl text-base font-bold flex items-center space-x-2 transition-all border border-slate-200"><Icons.ChevronLeft className="w-5 h-5"/> <span>ย้อนกลับ</span></button>}
                                {currentPage !== 'page14' && <button onClick={() => { const idx = menuItems.findIndex(m => m.id === currentPage); if(idx > 0 && idx < menuItems.length - 1) setCurrentPage(menuItems[idx+1].id); }} className="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-base font-bold flex items-center space-x-2 shadow-md transition-all"><span>หน้าถัดไป</span> <Icons.ChevronRight className="w-5 h-5"/></button>}
                            </div>
                        </div>
                        )}
                        <div className="flex-1 p-6 md:p-10 overflow-y-auto overflow-x-hidden w-full flex flex-col items-center print:p-0">
                            {renderPage({ currentPage, data, calMonth, setCalMonth, calYear, setCalYear, selectedDrawSport, setSelectedDrawSport, selectedMatchSport, setSelectedMatchSport, selectedMedalSport, setSelectedMedalSport, currentYear })}
                        </div>
                    </div>

                    {showLoginModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/70 backdrop-blur-sm p-4">
                            <div className="bg-white p-8 rounded-[2rem] shadow-2xl w-full max-w-sm text-center animate-modal">
                                <div className="w-20 h-20 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-5 shadow-inner"><Icons.Lock className="w-10 h-10" /></div>
                                <h3 className="text-2xl font-black text-slate-800 mb-2">เข้าสู่ระบบผู้ดูแล</h3>
                                <p className="text-sm text-slate-500 mb-6 font-medium">กรุณากรอกรหัส PIN 9 หลักเพื่อไปยังหน้าจัดการ</p>
                                <input type="password" className="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-3 text-center text-2xl tracking-[0.3em] font-black text-slate-800 outline-none focus:border-blue-500 mb-6" value={pinInput} onChange={e => setPinInput(e.target.value)} placeholder="•••••••••" onKeyDown={(e) => { if(e.key === 'Enter') handleLoginSubmit(); }} autoFocus/>
                                <div className="flex gap-3"><button onClick={() => {setShowLoginModal(false); setPinInput('');}} className="flex-1 px-4 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl">ยกเลิก</button><button onClick={handleLoginSubmit} className="flex-1 px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md">ยืนยันรหัส</button></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
